run:
  timeout: 5m
  go: "1.23"

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - gocritic
    - bodyclose
    - noctx
    - nolintlint
    - unconvert
    - gosec

linters-settings:
  revive:
    rules:
      # Standard Go http.HandlerFunc signatures always have (w, r) even when
      # one is unused. Renaming to _ hurts readability for no real benefit.
      - name: unused-parameter
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters: [errcheck, gosec, bodyclose, unused]
  max-issues-per-linter: 0
  max-same-issues: 0
