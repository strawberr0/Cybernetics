name: CI

# Repo had no CI before this branch.
#  - python-tests : fast unit gate (everything except the Playwright e2e file)
#  - frontend-build: tsc + vite
#  - e2e-tests    : the browser e2e test, run with its real prerequisites
#                   (built frontend/dist + an installed Chromium)
# Tests are tiered by prerequisite, not skipped — test_composer_e2e.py still
# runs, just in the job that has a browser.
#  - docker-build : proves the production image (Go cmd/composer server + built
#                   frontend) actually builds. The live Cloud Run deploy step in
#                   cloudbuild.yaml still needs GCP creds + the C1 auth decision
#                   (see TASK-LIST.md) and is intentionally not run here.

on:
  push:
    branches: [merge-prep-dev, main, master, Dev]
  pull_request:
    branches: [Dev, main, master]

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # pyproject [dev] covers the full test import graph (incl. boto3/motor
          # pulled in by broker.server's eager adapter imports). requirements.txt
          # holds runtime-only partner extras not needed for the unit suite.
          pip install -e ".[dev]"
      - name: Run unit tests (exclude browser e2e)
        run: pytest --ignore=tests/test_composer_e2e.py

  frontend-build:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  e2e-tests:
    name: Browser e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (e2e serves frontend/dist)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install python deps + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Run browser e2e
        run: pytest tests/test_composer_e2e.py

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t cybernetics:ci .
