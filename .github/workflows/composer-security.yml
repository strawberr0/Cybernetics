name: composer-security

# Hardening pipeline for the composer service:
#  - Go build/test/vet
#  - golangci-lint (style + correctness)
#  - gosec        (security static analysis)
#  - govulncheck  (known-CVE scan over the dependency closure)
#  - Trivy        (filesystem + container vulnerability scan)
#  - syft         (SBOM in CycloneDX JSON)
#  - cosign       (keyless signing of the produced image, OIDC via GitHub)
#
# All jobs are read-only against the repo. The build/push step is gated on
# success of every preceding gate.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # cosign keyless OIDC
  packages: write          # push to GHCR
  security-events: write   # codeql-action/upload-sarif (gosec, trivy)

concurrency:
  group: composer-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go test -race -cover
        run: go test -race -count=1 -coverprofile=cover.out ./...
      - name: coverage summary
        run: go tool cover -func=cover.out | tail -1

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          args: --timeout=5m

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: securego/gosec@v2.21.4
        with:
          args: -severity medium -confidence medium -exclude=G104,G304 -fmt sarif -out gosec.sarif ./...
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec.sarif

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  trivy-fs:
    name: trivy (filesystem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif

  build-and-sign:
    name: build → SBOM → sign
    needs: [go-test, lint, gosec, govulncheck, trivy-fs]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push (no provenance attest yet)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cybernetics:${{ github.sha }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign (keyless via OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/cybernetics@${{ steps.build.outputs.digest }}
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.17.7
      - name: Generate CycloneDX SBOM
        run: |
          syft ghcr.io/${{ github.repository_owner }}/cybernetics@${{ steps.build.outputs.digest }} \
            -o cyclonedx-json > sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
      - name: Attach SBOM to image (cosign attest)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes --predicate sbom.cdx.json --type cyclonedx \
            ghcr.io/${{ github.repository_owner }}/cybernetics@${{ steps.build.outputs.digest }}
